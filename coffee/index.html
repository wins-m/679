.card dl{display:grid;grid-template-columns:76px 1fr;gap:5px 10px;margin:12px 0}.card dt{color:var(--muted)}.card dd{margin:0;overflow-wrap:anywhere}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:12px}.date{color:var(--muted);font-size:12px}.actions{display:flex;gap:12px}.text-btn{background:none;padding:4px 0;font-size:14px;color:var(--ink)}.text-btn:hover{text-decoration:underline}.text-btn.danger{color:#8c3b32}.editor{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:26px}.editor-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.editor-head h2{font:24px var(--serif);margin:0}.editor-head .eyebrow{margin-bottom:6px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label,.field-label{font-size:14px;font-weight:500}.required{font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}input:not([type=file]),select,textarea{background:var(--white);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:9px 11px;width:100%;min-width:0;height:44px}textarea{height:108px;resize:vertical}input::placeholder,textarea::placeholder{color:#899087;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor details{border-top:1px solid var(--line);padding-top:12px;margin:0 0 16px}.editor summary{font-size:14px;font-weight:500;cursor:pointer;padding:3px 0 13px}.editor details[open] summary{padding-bottom:16px}.photo-picker{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:4px}.photo-preview{height:64px;width:64px;object-fit:cover;border-radius:3px}.photo-legend{color:var(--muted);font-size:12px;margin:6px 0 0}.save{width:100%;height:48px;font-size:15px}.local-note{color:var(--muted);font-size:12px;line-height:1.7;margin:12px 0 0}.form-error{font-size:14px;color:#8c3b32;margin:0 0 14px;white-space:pre-wrap}.notice{border:1px solid #c5986c;background:#fff3e4;padding:14px 18px;border-radius:6px;margin-top:20px;font-size:14px}.notice .btn{margin:8px 8px 0 0}footer{padding:32px 0 24px;display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.03em}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:5;background:var(--ink);color:var(--white);padding:12px 20px;border-radius:6px;box-shadow:0 8px 25px #0002;max-width:calc(100% - 32px);width:max-content;font-size:14px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:10px;padding:28px;max-width:440px;width:calc(100% - 40px);color:var(--ink);background:var(--white)}dialog::backdrop{background:#14231a66}dialog h2{font:24px var(--serif);margin:0 0 12px}dialog p{font-size:15px;margin:0 0 24px;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:end;gap:10px}[hidden]{display:none!important}@media(min-width:1450px){.workspace{grid-template-columns:minmax(0,1fr) 390px}.card h3{font-size:27px}}@media(max-width:1080px){.shell{padding:0 28px}.workspace{grid-template-columns:minmax(0,1fr) 340px;gap:24px}.cards{grid-template-columns:1fr}}@media(max-width:760px){.shell{padding:0 20px}.top{padding:18px 0}.top-note{display:none}.heading{padding:26px 0 24px;align-items:start;flex-direction:column;gap:18px}.statbar{padding:20px 16px;gap:10px}.stat strong{display:block;margin:0 0 6px;font-size:28px}.stat span{font-size:12px}.workspace{display:flex;flex-direction:column;gap:28px;margin-top:24px}.archive,.editor{width:100%}.editor{order:-1;padding:22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card-body{padding:16px}.card h3{font-size:21px}.card-foot{align-items:start;flex-direction:column;gap:4px}.empty{min-height:260px;padding:30px 24px}footer{flex-direction:column;gap:4px}}@media(max-width:480px){.cards{grid-template-columns:1fr}.card-foot{align-items:center;flex-direction:row}.photo{height:230px}.list-heading span{font-size:12px}}

<body>
<div class="shell">
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">b.</span> BEAN JOURNAL</div><span class="top-note">A SMALL ARCHIVE OF EVERY BAG.</span></header>
<div class="heading"><div><p class="eyebrow">THE FINISHED COLLECTION</p><h1>喝完的豆子</h1></div><div class="tools"><button class="btn" id="export">导出备份</button><button class="btn" id="import">导入记录</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></div>
<section class="statbar" aria-label="咖啡记录概览"><div class="stat"><strong id="count">0</strong><span>袋咖啡豆</span></div><div class="stat"><strong id="grams">0</strong><span id="weight-unit">克，已记录重量</span></div><div class="stat"><strong id="average">—</strong><span>平均评分 / 5</span></div></section>
<div class="notice" id="storage-notice" hidden role="alert"><span id="storage-message"></span><div><button class="btn" id="raw-export">导出原始数据</button><button class="btn" id="storage-retry">重新读取</button><button class="btn" id="storage-reset">清空损坏数据</button></div></div>
<main class="workspace">
<section class="archive" aria-labelledby="archive-title"><div class="list-heading"><h2 id="archive-title">咖啡豆档案</h2><span>按喝完日期排列</span></div><div id="empty" class="empty"><span class="empty-number" aria-hidden="true">No. 001</span><h3>从刚喝完的这一袋开始。</h3><p>记住喜欢的味道，也记住不想再买的豆子。几句话就够了。</p><button class="btn primary" id="start">记录第一袋</button></div><div class="cards" id="cards"></div></section>
<aside class="editor" aria-labelledby="editor-title"><div class="editor-head"><div><p class="eyebrow" id="editor-eyebrow">NEW ENTRY</p><h2 id="editor-title">留下一袋的记忆</h2></div><button class="text-btn" id="cancel-edit" hidden type="button">取消编辑</button></div>
<form id="bean-form">
<div class="field"><label for="name">豆子名称<span class="required">必填</span></label><input id="name" name="name" required maxlength="120" placeholder="例如：耶加雪菲 · 果丁丁" autocomplete="off"></div>
<div class="field"><label for="roaster">烘焙商</label><input id="roaster" name="roaster" maxlength="120" placeholder="这袋豆子来自哪里" autocomplete="off"></div>
<div class="row"><div class="field"><label for="finished">喝完日期<span class="required">必填</span></label><input id="finished" name="finished" type="date" required></div><div class="field"><label for="rating">个人评分</label><select id="rating" name="rating"><option value="">暂不评分</option value="5">5 · 很想再买</option><option value="4.5">4.5 · 非常喜欢</option><option value="4">4 · 喜欢</option><option value="3.5">3.5 · 不错</option><option value="3">3 · 一般</option><option value="2.5">2.5 · 不太喜欢</option><option value="2">2 · 不喜欢</option><option value="1.5">1.5 · 很不喜欢</option><option value="1">1 · 不想再喝</option></select></div></div>
<div class="field"><label for="flavors">风味关键词</label><input id="flavors" name="flavors" maxlength="200" placeholder="例如：柑橘、茉莉、巧克力"></div>
<div class="field"><label for="notes">喝下来的感受</label><textarea id="notes" name="notes" maxlength="5000" placeholder="喜欢哪里？怎么冲更好喝？下次还会买吗？"></textarea></div>
<details id="extra-fields"><summary>豆子详情与包装照片</summary>
<div class="row"><div class="field"><label for="origin">国家 / 产地</label><input id="origin" name="origin" maxlength="120" placeholder="例如：埃塞俄比亚"></div><div class="field"><label for="weight">包装重量（克）</label><input id="weight" name="weight" type="number" min="1" max="100000" step="1" placeholder="250"></div></div>
<div class="row"><div class="field"><label for="process">处理法</label><input id="process" name="process" list="process-list" maxlength="100" placeholder="水洗 / 日晒"><datalist id="process-list"><option value="水洗"><option value="日晒"><option value="蜜处理"><option value="厌氧发酵"></datalist></div><div class="field"><label for="roast">烘焙程度</label><select id="roast" name="roast"><option value="">未记录</option><option>浅烘</option><option>中浅烘</option><option>中烘</option><option>中深烘</option><option>深烘</option></select></div></div>
<div class="field"><label for="variety">品种 / 庄园</label><input id="variety" name="variety" maxlength="160" placeholder="例如：瑰夏 · 翡翠庄园"></div>
<div class="row"><div class="field"><label for="roasted">烘焙日期</label><input id="roasted" name="roasted" type="date"></div><div class="field"><label for="brew">冲煮方式</label><input id="brew" name="brew" list="brew-list" maxlength="100" placeholder="手冲 / 意式"><datalist id="brew-list"><option value="手冲"><option value="意式"><option value="摩卡壶"><option value="爱乐压"><option value="法压壶"><option value="冷萃"></datalist></div></div>
<div class="field"><span class="field-label">包装照片</span><div class="photo-picker"><img id="photo-preview" class="photo-preview" alt="所选包装照片" hidden><button class="btn" type="button" id="choose-photo">选择照片</button><button class="text-btn danger" type="button" id="remove-photo" hidden>移除</button><input type="file" accept="image/jpeg,image/png,image/webp" id="photo-file" hidden></div><p class="photo-legend">支持 JPG、PNG、WebP，照片会自动压缩。</p></div>
</details>
<p class="form-error" id="form-error" role="alert" hidden></p><button class="btn primary save" type="submit" id="save">保存这袋豆子</button><p class="local-note">记录和照片仅保存在当前浏览器。换设备或清除浏览器数据前，请导出备份。</p>
</form></aside>
</main>
<footer><span>BEAN JOURNAL · 一袋一记</span><span>保留自己的口味。</span></footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button class="btn" id="confirm-cancel" type="button">取消</button><button class="btn primary" id="confirm-ok" type="button">确认</button></div></dialog>
<script>
'use strict';
const KEY='bean-journal.v1', $=id=>document.getElementById(id), form=$('bean-form');
const textFields=['name','roaster','flavors','notes','origin','process','roast','variety','brew'];
const limits={name:120,roaster:120,flavors:200,notes:5000,origin:120,process:100,roast:30,variety:160,brew:100};
let records=[],editing=null,photo='',photoVersion=0,photoBusy=false,blocked=false,rawData=null,lastRaw=null,dirty=false,conflict=false,toastTimer,confirmResolve;
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function dateOK(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)||s<'1900-01-01'||s>'2199-12-31')return false;const d=new Date(s+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function validRecord(r){if(!r||typeof r!=='object'||Array.isArray(r))throw Error('记录格式不正确。');const out={};if(typeof r.id!=='string'||!r.id||r.id.length>100)throw Error('记录编号不正确。');out.id=r.id;for(const k of textFields){const val=r[k]??'';if(typeof val!=='string'||val.length>limits[k])throw Error('记录中的文字格式或长度不正确。');out[k]=val.trim()}if(!out.name)throw Error('每条记录都需要豆子名称。');if(!dateOK(r.finished))throw Error('喝完日期不正确。');out.finished=r.finished;out.roasted=r.roasted||'';if(out.roasted&&!dateOK(out.roasted))throw Error('烘焙日期不正确。');if(out.roasted&&out.roasted>out.finished)throw Error('烘焙日期不能晚于喝完日期。');out.rating=r.rating===null||r.rating===undefined||r.rating===''?null:r.rating;if(out.rating!==null&&(typeof out.rating!=='number'||out.rating<1||out.rating>5||out.rating*2%1))throw Error('评分应在 1–5 分之间，以 0.5 分递增。');out.weight=r.weight===null||r.weight===undefined||r.weight===''?null:r.weight;if(out.weight!==null&&(!Number.isInteger(out.weight)||out.weight<1||out.weight>100000))throw Error('重量应为 1–100000 之间的整数。');out.photo=r.photo||'';if(typeof out.photo!=='string'||out.photo.length>1000000||(out.photo&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(out.photo)))throw Error('照片格式不正确或照片太大。');out.updatedAt=typeof r.updatedAt==='string'&&!isNaN(Date.parse(r.updatedAt))?r.updatedAt:'1970-01-01T00:00:00.000Z';return out}
function parse(raw){const data=JSON.parse(raw);if(data.version!==1||!Array.isArray(data.records)||data.records.length>2000)throw Error('不是支持的咖啡豆备份文件。');const list=data.records.map(validRecord);if(new Set(list.map(x=>x.id)).size!==list.length)throw Error('备份中有重复编号。');return list}
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent=''},4500)}
function formError(message){$('form-error').textContent=message;$('form-error').hidden=!message}
function ask(title,message,label='确认'){if(confirmResolve)confirmResolve(false);$('confirm-title').textContent=title;$('confirm-message').textContent=message;$('confirm-ok').textContent=label;$('confirm-dialog').showModal();$('confirm-cancel').focus();return new Promise(resolve=>{confirmResolve=resolve})}
function finishConfirm(answer){$('confirm-dialog').close();const resolve=confirmResolve;confirmResolve=null;if(resolve)resolve(answer)}
$('confirm-cancel').onclick=()=>finishConfirm(false);$('confirm-ok').onclick=()=>finishConfirm(true);$('confirm-dialog').addEventListener('cancel',e=>{e.preventDefault();finishConfirm(false)});
function updateDisabled(){$('save').disabled=blocked||photoBusy;$('import').disabled=blocked;$('storage-reset').hidden=rawData===null;$('raw-export').hidden=rawData===null}
function load(){try{rawData=localStorage.getItem(KEY);const list=rawData?parse(rawData):[];records=list;lastRaw=rawData;blocked=false;conflict=false;$('storage-notice').hidden=true;render()}catch(e){blocked=true;$('storage-notice').hidden=false;$('storage-message').textContent=rawData!==null?'已有记录暂时无法读取。请先导出原始数据；修复前不会覆盖这些记录。':'浏览器无法保存记录。请允许此网站使用本地存储，或在普通浏览窗口打开。'}updateDisabled()}
function commit(next){if(blocked)throw Error('当前无法保存，请先处理页面顶部的提示。');if(conflict||localStorage.getItem(KEY)!==lastRaw)throw Error('另一页面已更新记录。请复制未保存的填写内容，刷新后再重试。');const value=JSON.stringify({version:1,records:next});try{localStorage.setItem(KEY,value)}catch(e){throw Error('保存失败，浏览器空间可能不足。请先导出备份，再减少包装照片。')}records=next;lastRaw=value;rawData=value;render()}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(){const sorted=[...records].sort((a,b)=>b.finished.localeCompare(a.finished)||b.updatedAt.localeCompare(a.updatedAt));$('count').textContent=records.length;const grams=records.reduce((n,r)=>n+(r.weight||0),0);$('grams').textContent=grams>=1000?(grams/1000).toLocaleString('zh-CN',{maximumFractionDigits:2}):grams.toLocaleString('zh-CN');$('weight-unit').textContent=grams>=1000?'千克，已记录重量':'克，已记录重量';const rated=records.filter(r=>r.rating!==null);$('average').textContent=rated.length?(rated.reduce((n,r)=>n+r.rating,0)/rated.length).toFixed(1):'—';$('empty').hidden=records.length>0;$('cards').replaceChildren();sorted.forEach((r,i)=>{const card=el('article','card');if(r.photo){const img=el('img','photo');img.src=r.photo;img.alt=r.name+'的包装照片';img.loading='lazy';card.append(img)}const body=el('div','card-body'),top=el('div','card-top');top.append(el('span','serial','No. '+String(sorted.length-i).padStart(3,'0')));if(r.rating!==null)top.append(el('span','score',r.rating.toFixed(1)+' / 5'));body.append(top,el('h3','',r.name),el('p','roaster',r.roaster||'烘焙商未记录'));const tags=el('div','tags');[r.origin,r.process,r.roast,...r.flavors.split(/[、,，;；]/).map(x=>x.trim()).filter(Boolean)].forEach(t=>tags.append(el('span','tag',t)));if(tags.childNodes.length)body.append(tags);body.append(el('p',r.notes?'note':'note empty-note',r.notes||'这袋豆子，还没留下感受。'));const details=el('details'),dl=el('dl');[['品种 / 庄园',r.variety],['包装重量',r.weight?r.weight+' g':''],['烘焙日期',r.roasted],['冲煮方式',r.brew]].forEach(([k,v])=>{if(v)dl.append(el('dt','',k),el('dd','',v))});if(dl.childNodes.length){details.append(el('summary','','更多豆子信息'),dl);body.append(details)}const foot=el('div','card-foot'),actions=el('div','actions'),edit=el('button','text-btn','编辑'),del=el('button','text-btn danger','删除');edit.type=del.type='button';edit.setAttribute('aria-label','编辑 '+r.name);del.setAttribute('aria-label','删除 '+r.name);edit.onclick=()=>startEdit(r);del.onclick=()=>deleteRecord(r);actions.append(edit,del);foot.append(el('span','date',r.finished.replaceAll('-','.')+' 喝完'),actions);body.append(foot);card.append(body);$('cards').append(card)})}
function showPhoto(){const img=$('photo-preview');img.hidden=!photo;if(photo)img.src=photo;else img.removeAttribute('src');$('remove-photo').hidden=!photo}
function resetForm(){photoVersion++;photoBusy=false;form.reset();$('finished').value=today();editing=null;photo='';dirty=false;showPhoto();$('cancel-edit').hidden=true;$('editor-title').textContent='留下一袋的记忆';$('editor-eyebrow').textContent='NEW ENTRY';$('save').textContent='保存这袋豆子';$('extra-fields').open=false;formError('');updateDisabled()}
async function mayDiscard(){return !dirty||await ask('放弃未保存的内容？','当前填写的内容还没有保存。','放弃内容')}
async function startEdit(r){if(!await mayDiscard())return;resetForm();editing=r.id;for(const k of [...textFields,'finished','roasted','rating','weight'])$(k).value=r[k]??'';photo=r.photo;showPhoto();$('cancel-edit').hidden=false;$('editor-title').textContent='编辑这一袋';$('editor-eyebrow').textContent='EDIT ENTRY';$('save').textContent='保存修改';$('extra-fields').open=!!(photo||r.origin||r.variety||r.weight||r.process||r.roast||r.roasted||r.brew);$('name').focus();$('editor-title').scrollIntoView({behavior:'smooth',block:'center'})}
$('cancel-edit').onclick=async()=>{if(await mayDiscard())resetForm()};$('start').onclick=()=>{$('name').focus();$('editor-title').scrollIntoView({behavior:'smooth',block:'center'})};form.addEventListener('input',()=>{dirty=true;formError('')});
form.onsubmit=e=>{e.preventDefault();if(photoBusy||blocked)return;try{const r={id:editing||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),updatedAt:new Date().toISOString(),finished:$('finished').value,roasted:$('roasted').value,rating:$('rating').value?Number($('rating').value):null,weight:$('weight').value?Number($('weight').value):null,photo};textFields.forEach(k=>r[k]=$(k).value.trim());const clean=validRecord(r);if(records.length>=2000&&!editing)throw Error('已达到 2000 条记录，请先导出备份。');if(editing&&!records.some(x=>x.id===editing))throw Error('这条记录已经删除，请刷新页面后重试。');commit(editing?records.map(x=>x.id===editing?clean:x):[...records,clean]);const wasEdit=!!editing;resetForm();notify(wasEdit?'修改已保存':'这一袋，记下了。')}catch(e){formError(e.message)}};
async function deleteRecord(r){if(!await ask('删除这袋豆子？','「'+r.name+'」的记录与照片将被删除。','删除记录'))return;try{commit(records.filter(x=>x.id!==r.id));if(editing===r.id)resetForm();notify('记录已删除')}catch(e){notify(e.message)}}
$('choose-photo').onclick=()=>$('photo-file').click();$('remove-photo').onclick=()=>{photoVersion++;photoBusy=false;photo='';dirty=true;$('photo-file').value='';showPhoto();updateDisabled()};
$('photo-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const version=++photoVersion;photoBusy=true;updateDisabled();formError('');let url;try{if(!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('请选择 JPG、PNG 或 WebP 照片。');if(f.size>15*1024*1024)throw Error('照片不能超过 15 MB。');url=URL.createObjectURL(f);const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1000/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.75);if(data.length>1000000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>1000000)throw Error('压缩后的照片仍然太大，请选择较小的照片。');if(version===photoVersion){photo=data;dirty=true;showPhoto()}}catch(e){if(version===photoVersion)formError(e.message||'照片无法读取，请更换一张。')}finally{if(url)URL.revokeObjectURL(url);if(version===photoVersion){photoBusy=false;e.target.value='';updateDisabled()}}};
function download(content,filename,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=()=>{if(blocked){notify('请使用顶部的「导出原始数据」按钮。');return}download(JSON.stringify({version:1,exportedAt:new Date().toISOString(),records},null,2),'coffee-journal-'+today()+'.json');notify('已导出记录与照片，记得保存备份文件。')};
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('备份文件不能超过 30 MB。');const imported=parse(await f.text());if(!imported.length){notify('这个备份还没有记录。');return}const map=new Map(records.map(r=>[r.id,r]));let added=0,updated=0;for(const r of imported){const old=map.get(r.id);if(!old){map.set(r.id,r);added++}else if(Date.parse(r.updatedAt)>Date.parse(old.updatedAt)){map.set(r.id,r);updated++}}if(map.size>2000)throw Error('合并后超过 2000 条记录。');if(!added&&!updated){notify('这些记录已经在档案里，无需重复导入。');return}if(!await ask('导入咖啡豆记录？','新增 '+added+' 袋，更新 '+updated+' 袋。同编号的记录保留较新的版本，其他现有记录会保留。','导入记录'))return;commit([...map.values()]);notify('导入完成：新增 '+added+' 袋，更新 '+updated+' 袋。')}catch(e){notify('导入失败：'+e.message)}finally{e.target.value=''}};
$('raw-export').onclick=()=>download(rawData||'','coffee-journal-recovery-'+today()+'.txt','text/plain');$('storage-retry').onclick=()=>{load();if(!blocked)notify('记录已重新读取。')};$('storage-reset').onclick=async()=>{if(!await ask('清空损坏的数据？','请先导出原始数据。清空后，当前浏览器中的原有记录将无法恢复。','清空数据'))return;try{if(localStorage.getItem(KEY)!==rawData){load();notify('数据已变化，请先重新检查。');return}localStorage.removeItem(KEY);load();resetForm();notify('现在可以重新记录了。')}catch(e){notify('浏览器仍然无法访问本地存储。')}};
window.addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==null)return;if(dirty||editing){conflict=true;notify('另一页面更新了记录。请复制未保存的填写内容，刷新后再保存。')}else load()});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
resetForm();load();
</script>
