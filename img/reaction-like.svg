<?xml version="1.0" encoding="UTF-8"?>
<!--
  The "like" icon for the Waline reaction button (see
  layouts/partials/comments/waline.html). Waline's stock reaction icons are
  loaded from unpkg.com, which the site's CSP img-src does not allow, so this
  one is served from the site's own origin instead.

  Rendered inside an <img>, so `currentColor` is not available; the colour is
  fixed and chosen to read on both the light (#fafafa) and dark (#212121)
  theme backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" role="img" aria-label="like">
  <path fill="#e0475b"
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
